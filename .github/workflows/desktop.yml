# Builds the desktop app on real Windows, macOS and Linux machines (native modules and installers
# need each OS). Run it from the Actions tab, or push a tag like v1.0.0 to attach the files to a release.
name: Applications de bureau

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npx electron-builder --win nsis zip --x64 --publish never
            unpacked: dist/win-unpacked
          - os: macos-latest
            build: npx electron-builder --mac dmg --arm64 --publish never
            unpacked: dist/mac-arm64
          - os: ubuntu-latest
            build: npx electron-builder --linux AppImage --x64 --publish never
            unpacked: dist/linux-unpacked
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.build }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # not signed: no paid Apple / Microsoft certificate
      - name: Vérifier que rien de privé n'est embarqué
        run: node scripts/check-package.mjs ${{ matrix.unpacked }}
      - uses: actions/upload-artifact@v4
        with:
          name: ClipForge-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
